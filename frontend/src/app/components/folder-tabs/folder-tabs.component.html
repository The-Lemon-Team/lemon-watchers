<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full">
  <div class="flex items-center space-x-2 overflow-x-auto py-1 custom-scrollbar text-xs">
    <!-- All folders tab -->
    <button
      (click)="selectFolder.emit('')"
      class="px-3 py-1.5 rounded-lg font-semibold flex items-center space-x-1.5 transition whitespace-nowrap"
      [ngClass]="selectedFolderSlug() === '' ? 'bg-lemon-500 text-slate-950' : 'bg-dark-800 text-slate-300 hover:bg-dark-750 border border-dark-700'">
      <span>📁</span>
      <span>Все папки</span>
      <span class="ml-1 text-[11px] px-1.5 py-0.2 rounded-full opacity-80" [ngClass]="selectedFolderSlug() === '' ? 'bg-slate-950/20' : 'bg-dark-700'">
        {{ totalWatchersCount() }}
      </span>
    </button>

    <!-- Dynamic folders -->
    @for (folder of folders(); track folder.id) {
      <div class="flex items-center">
        <button
          (click)="selectFolder.emit(folder.slug)"
          class="px-3 py-1.5 rounded-lg font-medium flex items-center space-x-1.5 transition whitespace-nowrap group"
          [ngClass]="selectedFolderSlug() === folder.slug ? 'bg-lemon-500 text-slate-950 font-bold' : 'bg-dark-800 text-slate-300 hover:bg-dark-750 border border-dark-700'">
          <span>{{ folder.icon }}</span>
          <span>{{ folder.title }}</span>
          <span class="ml-1 text-[11px] px-1.5 py-0.2 rounded-full" [ngClass]="selectedFolderSlug() === folder.slug ? 'bg-slate-950/20' : 'bg-dark-700 text-slate-400'">
            {{ folder.watchersCount || 0 }}
          </span>

          <!-- Delete button for non-system custom folders -->
          @if (!folder.isSystem) {
            <span
              (click)="onDelete(folder, $event)"
              class="ml-1.5 text-slate-400 hover:text-red-400 text-xs opacity-60 hover:opacity-100"
              title="Удалить пользовательскую папку">✕</span>
          }
        </button>
      </div>
    }

    <!-- Add folder chip -->
    <button
      (click)="openCreateFolder.emit()"
      class="px-2.5 py-1.5 rounded-lg bg-dark-850 hover:bg-dark-800 text-slate-400 hover:text-lemon-400 border border-dashed border-dark-700 transition flex items-center space-x-1 whitespace-nowrap">
      <span>+</span>
      <span>Папка</span>
    </button>
  </div>
</div>
