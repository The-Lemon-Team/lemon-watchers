<header class="border-b border-dark-700 bg-dark-850/95 backdrop-blur sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <span class="text-3xl">🍋</span>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="font-bold text-lg text-white tracking-wide">Lemon Watchers</h1>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-lemon-500/20 text-lemon-400 border border-lemon-500/30">Angular 21</span>
        </div>
        <p class="text-xs text-slate-400 hidden xl:block">Реактивный центр сбора, фильтрации и обогащения первоисточников</p>
      </div>
    </div>

    <!-- Header actions & SSE status -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <!-- SSE status indicator -->
      <div class="flex items-center space-x-2 text-xs px-2.5 sm:px-3 py-1.5 rounded-full bg-dark-800 border border-dark-700 shrink-0">
        <span class="w-2 h-2 rounded-full" [ngClass]="sseConnected() ? 'bg-emerald-400' : 'bg-red-400 pulse-live'"></span>
        <span class="text-slate-300 font-medium hidden sm:inline">{{ sseConnected() ? 'Live SSE активен' : 'Подключение...' }}</span>
      </div>

      <button
        (click)="openCreateFolder.emit()"
        class="flex items-center space-x-1.5 text-xs font-semibold px-2.5 sm:px-3 py-1.5 rounded-lg bg-dark-800 hover:bg-dark-700 text-slate-200 border border-dark-700 transition active:scale-95 shrink-0">
        <span>📁</span>
        <span class="hidden md:inline">Новая папка</span>
      </button>

      <button
        (click)="openCreateWatcher.emit()"
        class="flex items-center space-x-1.5 text-xs font-semibold px-2.5 sm:px-3 py-1.5 rounded-lg bg-lemon-500 hover:bg-lemon-400 text-slate-950 transition active:scale-95 shadow shrink-0">
        <span>+</span>
        <span class="hidden sm:inline">Добавить вотчер</span>
        <span class="sm:hidden">Вотчер</span>
      </button>

      <button
        (click)="triggerAll.emit()"
        [disabled]="isTriggeringAll() || !anyActiveWatchers()"
        [title]="!anyActiveWatchers() ? 'Все вотчеры на паузе. Активируйте хотя бы один вотчер (Mutex), чтобы запустить опрос' : 'Опросить все активные вотчеры'"
        class="flex items-center space-x-1.5 text-xs font-semibold px-2.5 sm:px-3 py-1.5 rounded-lg bg-dark-800 hover:bg-lemon-500 hover:text-slate-950 text-slate-300 border border-dark-700 transition active:scale-95 disabled:opacity-40 disabled:cursor-not-allowed shrink-0">
        <span>⚡</span>
        <span class="hidden md:inline">{{ isTriggeringAll() ? 'Опрос...' : 'Опросить все' }}</span>
      </button>

      <button
        (click)="toggleAllCollection.emit()"
        [disabled]="isPausingAll()"
        class="flex items-center space-x-1.5 text-xs font-semibold px-2.5 sm:px-3 py-1.5 rounded-lg border transition active:scale-95 disabled:opacity-50 shrink-0"
        [ngClass]="anyActiveWatchers() ? 'bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border-amber-500/40' : 'bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border-emerald-500/40'">
        <span>{{ anyActiveWatchers() ? '⏸️' : '▶️' }}</span>
        <span class="hidden md:inline">{{ isPausingAll() ? 'Обновление...' : (anyActiveWatchers() ? 'Приостановить сбор' : 'Возобновить сбор') }}</span>
      </button>
    </div>
  </div>
</header>
