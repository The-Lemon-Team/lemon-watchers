<app-modal
  [isOpen]="isOpen()"
  (close)="onClose()"
  maxWidth="max-w-md"
  panelClass="p-5 space-y-4"
>
  <div class="flex items-center justify-between border-b border-dark-750 pb-3">
    <h3 class="text-base font-bold text-white flex items-center space-x-2">
      <span>📁</span>
      <span>Создать новую папку (категорию)</span>
    </h3>
    <button (click)="onClose()" class="text-slate-400 hover:text-white" aria-label="Закрыть">✕</button>
  </div>

  <div class="space-y-3 text-xs">
    <div>
      <label class="block text-slate-400 mb-1 font-medium">Название папки *</label>
      <input
        type="text"
        [(ngModel)]="title"
        placeholder="Например: Криптовалюта &amp; Web3"
        class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-lemon-500 transition" />
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-slate-400 mb-1 font-medium">Иконка (эмодзи)</label>
        <input
          type="text"
          [(ngModel)]="icon"
          placeholder="📁, ⚡, 💎, 🚀"
          class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-lemon-500 transition" />
      </div>
      <div>
        <label class="block text-slate-400 mb-1 font-medium">Цвет метки</label>
        <div class="flex items-center space-x-2">
          <input
            type="color"
            [(ngModel)]="color"
            class="h-9 w-12 rounded cursor-pointer bg-dark-800 border border-dark-700" />
          <span class="font-mono text-slate-300">{{ color }}</span>
        </div>
      </div>
    </div>

    <div>
      <label class="block text-slate-400 mb-1 font-medium">Описание (необязательно)</label>
      <textarea
        [(ngModel)]="description"
        rows="2"
        placeholder="Краткое описание категории источников..."
        class="w-full bg-dark-800 border border-dark-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-lemon-500 transition custom-scrollbar"></textarea>
    </div>
  </div>

  <div class="flex justify-end space-x-2 pt-2 border-t border-dark-750">
    <button (click)="onClose()" class="px-4 py-2 rounded-lg bg-dark-800 hover:bg-dark-750 text-slate-300 text-xs font-semibold">Отмена</button>
    <button (click)="onSubmit()" [disabled]="!title.trim()" class="px-4 py-2 rounded-lg bg-lemon-500 hover:bg-lemon-400 text-slate-950 text-xs font-bold disabled:opacity-50 transition">
      Создать папку
    </button>
  </div>
</app-modal>
